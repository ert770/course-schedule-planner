<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px system-ui;padding:20px} input,button{display:block;padding:12px;margin:12px 0;max-width:90%}</style><h1>模擬校務登入</h1><p>僅供本機測試；請勿輸入真實帳號或密碼。</p><div id="login"><label>模擬帳號<input aria-label="模擬帳號" autocomplete="off"></label><label>模擬密碼<input aria-label="模擬密碼" type="password" autocomplete="off"></label><button id="submit">模擬登入</button></div><div id="content" hidden><p>虛構修課紀錄</p><nav></nav><table><thead><tr><th>課號</th><th>課名</th><th>學年</th><th>學期</th><th>學分</th><th>成績</th></tr></thead><tbody></tbody></table></div><script>
const tabs=['courseXd','courseKind1','courseXc','courseKind23','courseSelP','courseSelPno'];
const nav=document.querySelector('nav'); tabs.forEach((t,i)=>{const a=document.createElement('a');a.href='#/'+t;a.textContent='分類'+(i+1)+' ';nav.append(a)});
function update(){const id=location.hash.slice(2); if(!tabs.includes(id))return; const i=tabs.indexOf(id); const rows=i===0?[['TEST1001','虛構課程甲','112','1','3','55']]:i===1?[['TEST1001','虛構課程甲','112','1','3','55'],['TEST1001','虛構課程甲','113','1','3','80']]:[['TEST100'+(i+1),'虛構課程','112','2','2','75']];const tbody=document.querySelector('tbody');tbody.replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');r.forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.append(td)});return tr}));document.body.dataset.loaded=id}
addEventListener('hashchange',update);document.querySelector('#submit').onclick=()=>{document.querySelector('#login').hidden=true;document.querySelector('#content').hidden=false;location.hash='/history'};
</script>
