name: CI

on:
  pull_request:
    branches:
      - main
      - backend
  push:
    branches:
      - main
      - backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Lint frontend
        run: npm run lint
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      # Roadmap #24 的 golden set 會真的呼叫模型。secret 沒設定時這裡會是空字串，
      # 測試檔偵測到「CI 且無 key」就跳過那幾題並印出說明（其餘測試照跑）。
      # 在 repository secrets 加上 OPENAI_API_KEY 之後，這一行就會讓它自動開始實跑，
      # 不需要改任何程式。
      - name: Test backend
        run: npm test
        working-directory: server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check backend JavaScript syntax
        shell: bash
        run: git ls-files -z 'server/src/**/*.js' | xargs -0 -n1 node --check
